name: Deploy Prod

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: prod
    steps:
      - uses: download-artifact@v8
        with:
          name: octomatch
          path: website
          run-id: ${{ github.event.workflow_run.id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Deploy to production
        run: |
          echo "Download artifact contents:"
          tree website
          echo "Demo deploy step: replace with your deployment command"
          